services:
  # --- MODULE 5: INGESTION (Apache Kafka KRaft) ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: crypto-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # --- MODULE 2 & 3: STORAGE & BATCH (Hadoop HDFS) ---
  crypto-namenode:
    build:
      context: .
      dockerfile: Dockerfile.namenode
    container_name: crypto-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=crypto-cluster
    env_file:
      - ./hadoop.env
    volumes:
      - ./:/workspace
      - namenode_data:/hadoop/dfs/name

  crypto-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: crypto-datanode
    depends_on:
      - crypto-namenode
    env_file:
      - ./hadoop.env
    volumes:
      - ./:/workspace
      - datanode_data:/hadoop/dfs/data

  # --- MODULE 4: REAL-TIME ANALYTICS (Apache Spark) ---
  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: crypto-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./:/workspace

  spark-worker:
    image: apache/spark:3.5.0-python3
    container_name: crypto-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://crypto-spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./:/workspace

  # --- DRIVER & NOTEBOOK ---
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: crypto-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    depends_on:
      - kafka
      - spark-master
      - crypto-namenode
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --notebook-dir=/workspace
    volumes:
      - ./:/workspace

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
